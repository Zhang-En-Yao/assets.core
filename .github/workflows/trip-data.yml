name: Trip data

# Called by every assets.trip.* repository, so the build scripts exist once, here.
#
# On request only. It fetches from Wikidata and Overpass, which are shared public
# services, and it publishes a tag — neither belongs on a push. Push runs
# trip-check.yml instead, which validates and touches nothing.
#
#   # assets.trip.<id>/.github/workflows/data.yml
#   name: Data
#   on:
#     workflow_dispatch:
#       inputs:
#         places: { type: boolean, default: true }
#         streets: { type: boolean, default: false }
#   jobs:
#     build:
#       uses: Zhang-En-Yao/assets.core/.github/workflows/trip-data.yml@main
#       secrets: inherit
#       with:
#         places: ${{ inputs.places }}
#         streets: ${{ inputs.streets }}

on:
  workflow_call:
    inputs:
      places:
        description: Refresh places.json from Wikidata
        type: boolean
        default: true
      streets:
        description: Fetch any streets.json maps that are missing
        type: boolean
        default: false
      tag:
        description: Tag to publish as; the date if left blank
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trip
        uses: actions/checkout@v4

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          repository: Zhang-En-Yao/assets.core
          path: .core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Places
        if: inputs.places
        run: python3 .core/build/build-places.py

      # Overpass is a shared public instance; this only asks for maps that are not
      # already in streets.json, and fails the run if any query fails, so a half-fetched
      # file is never published as if it were whole.
      - name: Streets
        if: inputs.streets
        run: python3 .core/build/build-streets.py

      - name: Validate
        run: python3 .core/build/validate-trip.py

      - name: Publish
        run: |
          rm -rf .core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="$(date -u +%Y-%m-%d)"

          if git diff --quiet; then
            echo "The build produced no change." >> "$GITHUB_STEP_SUMMARY"
          else
            git add -A
            git commit -m "Rebuild trip data ($tag)"
          fi

          # jsDelivr caches a tag forever, so a tag that already exists somewhere else is
          # not a tag to reuse: force-moving it leaves the CDN serving the old bytes with
          # no error and no way to tell. Take the next free suffix instead — the whole
          # point of pinning a tag is that it never means two different things.
          git fetch --tags --force --quiet
          base="$tag"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Already published as \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            n=$((n + 1)); tag="$base.$n"
          done
          git tag -a "$tag" -m "$tag"
          git push origin HEAD --force-with-lease
          # Pushed by name: --follow-tags ignores lightweight tags, which is how a tag can
          # look created here and not exist on the remote.
          git push origin "refs/tags/$tag"
          {
            echo "### Published \`$tag\`"
            echo
            echo "Point the site's travel/index.json at it:"
            echo '```json'
            echo "\"assets\": \"${{ github.repository }}@$tag\""
            echo '```'
            echo
            echo '```json'
            cat MANIFEST.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"