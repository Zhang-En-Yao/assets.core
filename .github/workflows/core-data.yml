name: Rebuild core data

# Natural Earth publishes a new release every few years and AT-HYG a few times a year, so
# this runs on request and once a quarter as a safety net. It never pushes to the site:
# it tags this repository, and the site's pin is moved by hand.
on:
  workflow_dispatch:
    inputs:
      atlas:
        description: Rebuild the atlas (countries and marine areas)
        type: boolean
        default: true
      sky:
        description: Rebuild the star charts
        type: boolean
        default: true
  schedule:
    - cron: "0 4 1 1,4,7,10 *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atlas
        if: github.event_name == 'schedule' || inputs.atlas
        run: |
          python3 build/build-atlas.py
          python3 build/build-continents.py

      - name: Sky
        if: github.event_name == 'schedule' || inputs.sky
        run: python3 build/build-stars.py

      # Shape, invariants and drift. A dataset that lost rows fails here, before anything
      # is committed, because an upstream outage looks like an empty result, not an error.
      - name: Validate
        run: python3 build/validate.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(date -u +%Y-%m-%d)"

          if git diff --quiet; then
            echo "The build produced no change." >> "$GITHUB_STEP_SUMMARY"
          else
            git add -A
            git commit -m "Rebuild core data ($tag)"
          fi

          # Tag whatever is current, changed or not — see trip-data.yml for why.
          if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "Already published as \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag -f -a "$tag" -m "$tag"
          git push origin HEAD --force-with-lease
          git push -f origin "refs/tags/$tag"
          {
            echo "### Published \`$tag\`"
            echo
            echo "Point the site at it:"
            echo '```js'
            echo "export const CORE = 'https://cdn.jsdelivr.net/gh/${{ github.repository }}@$tag';"
            echo '```'
            echo
            echo '```json'
            cat MANIFEST.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
